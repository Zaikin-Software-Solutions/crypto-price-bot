services:
  crypto-price-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-price-bot:latest
    container_name: crypto-price-bot
    restart: unless-stopped
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
